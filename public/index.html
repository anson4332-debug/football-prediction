<!DOCTYPE html>
<html lang="zh-HK">
<head>
    <meta charset="UTF-8">
    <title>足球賽事實時預測中心 (Livescore & AI Predictions)</title>
    <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-slate-900 text-white min-h-screen p-6">
    <div class="max-w-6xl mx-auto space-y-6">
        <!-- Header -->
        <div class="flex justify-between items-center border-b border-slate-700 pb-4">
            <div>
                <h1 class="text-2xl font-bold text-emerald-400">⚽ 足球賽事實時預測中心 (Livescore)</h1>
                <p class="text-sm text-slate-400">點擊任意賽事可查看實時比分與動態走勢預測</p>
            </div>
            <div class="text-right">
                <span class="text-xs bg-slate-800 border border-slate-700 px-3 py-1 rounded-full text-emerald-300 animate-pulse">
                    🟢 實時連線中 (Live)
                </span>
            </div>
        </div>

        <!-- Dashboard -->
        <div class="bg-slate-800 p-4 rounded-lg border border-slate-700 flex justify-around text-center">
            <div>
                <div class="text-xs text-slate-400">預測總準確率</div>
                <div id="accuracy-rate" class="text-3xl font-extrabold text-emerald-400">--%</div>
            </div>
            <div class="border-r border-slate-700"></div>
            <div>
                <div class="text-xs text-slate-400">已追蹤完結賽事</div>
                <div id="total-matches" class="text-3xl font-extrabold text-white">--</div>
            </div>
        </div>

        <!-- 賽事列表 -->
        <div class="bg-slate-800 rounded-lg p-5 border border-slate-700">
            <h2 class="text-lg font-semibold mb-4 text-emerald-300">今日焦點賽程 (點擊查看 Livescore 實時數據)</h2>
            <div class="overflow-x-auto">
                <table class="w-full text-left text-sm">
                    <thead class="bg-slate-700/50 text-slate-300">
                        <tr>
                            <th class="p-3">聯賽</th>
                            <th class="p-3">時間 (HKT)</th>
                            <th class="p-3">對賽隊伍 (港譯)</th>
                            <th class="p-3 text-emerald-400">賽前/賽中預測波膽</th>
                            <th class="p-3 text-emerald-400">角球預測</th>
                            <th class="p-3">實時比分 / 狀態</th>
                        </tr>
                    </thead>
                    <tbody id="matches-table-body">
                        <tr><td colspan="6" class="p-4 text-center text-slate-400">正在加載實時賽程...</td></tr>
                    </tbody>
                </table>
            </div>
        </div>
    </div>

    <!-- 🔍 Livescore 彈出視窗 (Modal) -->
    <div id="match-modal" class="fixed inset-0 bg-black/70 hidden flex items-center justify-center p-4 z-50">
        <div class="bg-slate-800 border border-slate-600 rounded-xl max-w-lg w-full p-6 space-y-5 relative shadow-2xl">
            <button onclick="closeModal()" class="absolute top-4 right-4 text-slate-400 hover:text-white text-xl font-bold">✕</button>
            
            <div class="text-center border-b border-slate-700 pb-3">
                <span id="modal-league" class="text-xs bg-emerald-900/60 text-emerald-300 px-2.5 py-1 rounded-full border border-emerald-700">聯賽</span>
                <h3 id="modal-teams" class="text-xl font-extrabold text-white mt-2">主隊 vs 客隊</h3>
                <div id="modal-time" class="text-xs text-slate-400 mt-1">開賽時間</div>
            </div>

            <!-- Livescore 即時比分板 -->
            <div class="bg-slate-900/80 rounded-lg p-4 border border-slate-700 text-center space-y-2">
                <div class="text-xs text-amber-400 font-semibold uppercase tracking-wider" id="modal-status">實時進行中</div>
                <div class="text-4xl font-black text-white tracking-widest" id="modal-score">1 - 1</div>
                <div class="text-xs text-slate-400" id="modal-elapsed">比賽進行中: 58' 分鐘</div>
            </div>

            <!-- 動態實時預測分析 -->
            <div class="bg-slate-700/30 rounded-lg p-4 border border-slate-700 space-y-2">
                <div class="text-xs font-bold text-emerald-400 uppercase">📈 AI 實時走勢預測 (In-Play Analysis)</div>
                <p id="modal-analysis" class="text-sm text-slate-300 leading-relaxed">分析載入中...</p>
                <div class="flex justify-between text-xs text-slate-400 pt-2 border-t border-slate-700">
                    <span>預測波膽: <strong id="modal-pred-score" class="text-emerald-300">--</strong></span>
                    <span>預測角球: <strong id="modal-pred-corners" class="text-emerald-300">--</strong></span>
                </div>
            </div>

            <button onclick="closeModal()" class="w-full bg-emerald-600 hover:bg-emerald-500 text-white font-bold py-2 rounded-lg transition">
                關閉實時面板
            </button>
        </div>
    </div>

    <script>
        let allMatches = [];

        async function loadLiveData() {
            try {
                const res = await fetch('/api/matches');
                const data = await res.json();

                document.getElementById('accuracy-rate').innerText = data.accuracy;
                document.getElementById('total-matches').innerText = data.totalFinished;
                allMatches = data.matches;

                const tbody = document.getElementById('matches-table-body');
                if(allMatches.length === 0) {
                    tbody.innerHTML = `<tr><td colspan="6" class="p-4 text-center text-slate-400">暫無賽事</td></tr>`;
                    return;
                }

                tbody.innerHTML = allMatches.map((m) => `
                    <tr onclick="openModal('${m.id}')" class="border-b border-slate-700/50 hover:bg-slate-700/40 cursor-pointer transition">
                        <td class="p-3 font-medium text-slate-300">${m.league}</td>
                        <td class="p-3 text-amber-400">${m.time}</td>
                        <td class="p-3 font-semibold text-white">${m.homeTeam} vs ${m.awayTeam}</td>
                        <td class="p-3 font-bold text-emerald-400">${m.predScore}</td>
                        <td class="p-3 text-emerald-300">${m.predCorners}</td>
                        <td class="p-3">
                            <span class="px-2.5 py-1 rounded text-xs font-bold ${m.status.includes('LIVE') || m.status.includes('進行') ? 'bg-red-600 text-white animate-pulse' : 'bg-slate-700 text-slate-200'}">
                                ${m.score} (${m.status})
                            </span>
                        </td>
                    </tr>
                `).join('');
            } catch (err) {
                console.error(err);
            }
        }

        function openModal(id) {
            const m = allMatches.find(item => item.id == id);
            if(!m) return;

            document.getElementById('modal-league').innerText = m.league;
            document.getElementById('modal-teams').innerText = `${m.homeTeam} vs ${m.awayTeam}`;
            document.getElementById('modal-time').innerText = `開賽時間: ${m.time}`;
            document.getElementById('modal-status').innerText = m.status;
            document.getElementById('modal-score').innerText = m.score;
            document.getElementById('modal-elapsed').innerText = `比賽進度: ${m.elapsed ? m.elapsed + '\'' : '未開始'}`;
            document.getElementById('modal-analysis').innerText = m.liveAnalysis;
            document.getElementById('modal-pred-score').innerText = m.predScore;
            document.getElementById('modal-pred-corners').innerText = m.predCorners;

            document.getElementById('match-modal').classList.remove('hidden');
        }

        function closeModal() {
            document.getElementById('match-modal').classList.add('hidden');
        }

        loadLiveData();
        setInterval(loadLiveData, 30000); // 每 30 秒自動刷新實時比分
    </script>
</body>
</html>
